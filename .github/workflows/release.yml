name: Release (ad-hoc)

# Ad-hoc distribution path. Does not require a paid Apple Developer Program
# membership. Artifacts are not Developer ID signed or notarized. Users must
# bypass Gatekeeper on first launch. See RELEASE_NOTES.md.
#
# Every push to main packages a universal build and creates a GitHub prerelease
# for tag v<VERSION> when that tag does not already exist. Published assets are
# immutable: reusing a tag/version requires bumping VERSION or BUILD_NUMBER.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-adhoc-main
  cancel-in-progress: true

jobs:
  adhoc-release:
    name: Package ad-hoc universal release and publish
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release identity is unique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          TAG="v${VERSION}"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            printf 'Invalid VERSION %s (expected semantic version).\n' "$VERSION" >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            printf 'Invalid BUILD_NUMBER %s (expected positive integer).\n' "$BUILD_NUMBER" >&2
            exit 1
          }

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              printf 'Release tag %s already exists for commit %s; this push is %s.\n' \
                "$TAG" "$EXISTING_SHA" "$GITHUB_SHA" >&2
              printf 'Bump VERSION or BUILD_NUMBER (and the tag) before publishing another release.\n' >&2
              exit 1
            fi
            printf 'Tag %s already points at this commit; refusing to replace published assets.\n' "$TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'GitHub release %s already exists. Bump VERSION before publishing.\n' "$TAG" >&2
            exit 1
          fi

          printf 'Release identity OK: tag=%s version=%s build=%s\n' "$TAG" "$VERSION" "$BUILD_NUMBER"

      - name: Build ad-hoc universal release
        run: ./script/package_release.sh --adhoc --skip-notarization --arch universal

      - name: Verify ad-hoc package integrity
        run: ./script/verify_release.sh --app dist/release/BarTender.app --dmg "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Mount, copy, and launch the DMG
        run: ./script/install_smoke_test.sh "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          TAG="v${VERSION}"
          ZIP="dist/release/BarTender-${VERSION}.zip"
          DMG="dist/release/BarTender-${VERSION}.dmg"
          SUMS="dist/release/SHA256SUMS.txt"
          TITLE="Bar Tender ${VERSION} (build ${BUILD_NUMBER}, ad-hoc)"

          # Create the tag only for this commit — never force-move an existing tag.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

          gh release create "$TAG" "$ZIP" "$DMG" "$SUMS" \
            --prerelease \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md
