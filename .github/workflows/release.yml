name: Release (ad-hoc)

# Ad-hoc distribution path. Does not require a paid Apple Developer Program
# membership. Artifacts are not Developer ID signed or notarized. Users must
# bypass Gatekeeper on first launch. See RELEASE_NOTES.md.
#
# Every push to main rebuilds the universal package and creates or updates the
# GitHub prerelease for the tag matching VERSION (v<VERSION>).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-adhoc-main
  cancel-in-progress: true

jobs:
  adhoc-release:
    name: Package ad-hoc universal release and publish
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ad-hoc universal release
        run: ./script/package_release.sh --adhoc --skip-notarization --arch universal

      - name: Verify ad-hoc package integrity
        run: ./script/verify_release.sh --app dist/release/BarTender.app --dmg "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Mount, copy, and launch the DMG
        run: ./script/install_smoke_test.sh "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Publish or update prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          ZIP="dist/release/BarTender-${VERSION}.zip"
          DMG="dist/release/BarTender-${VERSION}.dmg"
          SUMS="dist/release/SHA256SUMS.txt"

          # Point the version tag at this commit so the release tracks main.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$DMG" "$SUMS" --clobber
            gh release edit "$TAG" \
              --title "Bar Tender ${VERSION} (ad-hoc)" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP" "$DMG" "$SUMS" \
              --prerelease \
              --title "Bar Tender ${VERSION} (ad-hoc)" \
              --notes-file RELEASE_NOTES.md
          fi
