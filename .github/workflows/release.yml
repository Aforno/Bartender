name: Release

# Public prerelease distribution path. Packages a universal app with an ad-hoc
# signature (no paid Apple Developer Program membership required). Artifacts
# are not Developer ID signed or notarized. Users must bypass Gatekeeper on
# first launch. See RELEASE_NOTES.md.
#
# Release only runs when VERSION or BUILD_NUMBER changes on main. That keeps
# feature merges from failing the immutable tag check. Bump one of those files
# (and refresh CHANGELOG / RELEASE_NOTES) when you intend to publish.

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - BUILD_NUMBER

permissions:
  contents: write

concurrency:
  group: release-prerelease-main
  cancel-in-progress: true

jobs:
  prerelease:
    name: Package universal prerelease and publish
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release identity is unique
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          TAG="v${VERSION}+build.${BUILD_NUMBER}"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            printf 'Invalid VERSION %s (expected semantic version).\n' "$VERSION" >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            printf 'Invalid BUILD_NUMBER %s (expected positive integer).\n' "$BUILD_NUMBER" >&2
            exit 1
          }

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            printf 'Release tag %s already exists for commit %s. Skipping publish (identity unchanged).\n' \
              "$TAG" "$EXISTING_SHA"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'GitHub release %s already exists. Skipping publish (identity unchanged).\n' "$TAG"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Release identity OK: tag=%s version=%s build=%s\n' "$TAG" "$VERSION" "$BUILD_NUMBER"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Build universal release package
        if: steps.identity.outputs.should_publish == 'true'
        run: ./script/package_release.sh --adhoc --skip-notarization --arch universal

      - name: Verify package integrity
        if: steps.identity.outputs.should_publish == 'true'
        run: ./script/verify_release.sh --app dist/release/BarTender.app --dmg "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Mount, copy, and launch the DMG
        if: steps.identity.outputs.should_publish == 'true'
        run: ./script/install_smoke_test.sh "dist/release/BarTender-$(tr -d '[:space:]' < VERSION).dmg"

      - name: Publish immutable prerelease
        if: steps.identity.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          TAG="v${VERSION}+build.${BUILD_NUMBER}"
          ZIP="dist/release/BarTender-${VERSION}.zip"
          DMG="dist/release/BarTender-${VERSION}.dmg"
          SUMS="dist/release/SHA256SUMS.txt"
          TITLE="Bar Tender ${VERSION} (build ${BUILD_NUMBER})"

          # Let GitHub create the tag as part of release creation. Clean up a
          # partially-created release/tag when asset upload fails so rerunning the
          # same immutable build is possible without manual tag surgery.
          if ! gh release create "$TAG" "$ZIP" "$DMG" "$SUMS" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md; then
            printf 'Release creation failed; cleaning partial release/tag %s.\n' "$TAG" >&2
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
            exit 1
          fi
